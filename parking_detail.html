<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>스마트오피스 예약시스템 - 주차정산</title>

  <link rel="stylesheet" type="text/css" href="./css/mobile_a/fonts.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/base.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/icons.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/common.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/layout.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/styleLayout.css" />
  <link rel="stylesheet" type="text/css" href="./css/mobile_a/colorStyle.css" />
  <link rel="stylesheet" href="./css/mobile_a/jquery.modal.css" />

  <style>
    /* 하단 5개 탭 바 QR 센터 버튼 스타일 */
    .footerNav {
      overflow: visible !important;
    }

    .footerNav ul.btnArea {
      overflow: visible !important;
      display: flex !important;
      align-items: flex-end !important;
    }

    .footerNav ul.btnArea li {
      float: none !important;
      flex: 1 !important;
      overflow: visible !important;
    }

    .footerNav ul.btnArea li.center-qr-li {
      overflow: visible !important;
    }

    .footerNav ul.btnArea li a.center-qr-btn {
      position: relative !important;
      height: 56px !important;
      background: none !important;
      display: inline-block !important;
      width: 100% !important;
      overflow: visible !important;
    }

    .footerNav ul.btnArea li a.center-qr-btn .qr-circle {
      position: absolute;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #ffffff !important;
      border: 1.5px solid #e1e4e6 !important;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.03), 0 4px 12px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      box-sizing: content-box;
    }

    .footerNav ul.btnArea li a.center-qr-btn:active .qr-circle {
      background-color: #f1f3f5 !important;
      border-color: #d1d5db !important;
      transform: translateX(-50%) scale(0.95);
    }

    .footerNav ul.btnArea li a.center-qr-btn .qr-circle::before {
      content: "";
      width: 24px;
      height: 24px;
      display: block;
      background: url('./images/mobile_a/common/ico_qr.svg') no-repeat center center;
      background-size: 100% 100%;
    }

    .footerNav ul.btnArea li a.center-qr-btn:active .qr-circle::before {
      background: url('./images/mobile_a/common/ico_qr_.svg') no-repeat center center;
      background-size: 100% 100%;
    }

    .footerNav ul.btnArea li a.center-qr-btn span {
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      text-align: center !important;
      font-size: 13px !important;
      color: var(--text-black03-color) !important;
      line-height: normal !important;
    }

    /* 주차정산 모달 커스텀 오버레이 및 중앙 정렬 스타일 */
    .parking-modal-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      z-index: 99999 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(0, 0, 0, 0.5) !important;
      display: none;
      box-sizing: border-box !important;
    }

    .parking-modal-overlay .modal-box {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 90% !important;
      max-width: 330px !important;
      padding: 0 !important;
      margin: 0 !important;
      box-sizing: border-box !important;
    }

    .parking-modal-overlay .modal-inner {
      position: relative;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 15px;
      overflow: hidden;
      background: #ffffff;
    }

    .parking-modal-overlay .modal-title {
      width: 100%;
      background: #505c6d;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      padding: 14px 20px;
      margin: 0;
      box-sizing: border-box;
    }

    .parking-modal-overlay .modal-pop {
      padding: 20px;
      background: #ffffff;
      box-sizing: border-box;
    }

    .parking-modal-overlay .modal-text {
      text-align: center;
      font-size: 14px;
      color: #111827;
      line-height: 1.55;
      margin: 0 0 16px;
      white-space: pre-line;
      word-break: keep-all;
    }

    .parking-modal-overlay .modal-buttons {
      display: flex;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .parking-modal-overlay .modal-buttons a {
      flex: 1;
      height: 42px;
      line-height: 42px;
      text-align: center;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: block;
    }

    .parking-modal-overlay .modal-buttons a.pri {
      background: #D71635;
      color: #ffffff !important;
      border: none;
    }

    .parking-modal-overlay .modal-buttons a:not(.pri) {
      background: #ffffff;
      border: 1px solid #d1d5db;
      color: #374151 !important;
    }

    #contents.parking,
    #contents {
      padding-bottom: 90px !important;
    }

    /* ==========================================================================
       시연용 시나리오 전환 바 (목업 테스트 전용 - 차분한 라이트 그레이 톤)
       ========================================================================== */
    .demo-scenario-bar {
      margin: 8px 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      background: #F8FAFC;
      color: #475569;
      box-sizing: border-box;
    }

    .demo-scenario-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11.5px;
      color: #64748B;
      font-weight: 600;
    }

    .demo-scenario-head strong {
      color: #334155;
      font-weight: 700;
    }

    .demo-scenario-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .demo-chip {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #475569;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .demo-chip:hover {
      background: #F1F5F9;
      color: #1E293B;
    }

    .demo-chip.active {
      background: #475569;
      border-color: #475569;
      color: #FFFFFF;
      font-weight: 700;
    }

    /* ==========================================================================
       주차권 등록 개선 (24시간 모듈러 룰 엔진 & 스마트 가이드 UX - 차분한 컬러 톤)
       ========================================================================== */

    /* 1. 상단 주차 할인 스마트 가이드 박스 (파스텔/슬레이트 톤으로 차분하게 정돈) */
    .parking-smart-guide {
      margin: 12px 0 18px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #DCE3EC;
      border-left: 4px solid #5B7DB1;
      background: #F7F9FC;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    .parking-smart-guide.state-warning {
      border-color: #E6D2D2;
      border-left: 4px solid #B85D5D;
      background: #FBF7F7;
    }

    .parking-smart-guide.state-recommend {
      border-color: #DCE3EC;
      border-left: 4px solid #4A6FA5;
      background: #F7F9FC;
    }

    .parking-smart-guide.state-complete {
      border-color: #D4E4DC;
      border-left: 4px solid #4D8B6E;
      background: #F6FAF8;
    }

    .parking-smart-guide .guide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .parking-smart-guide .guide-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #334E68;
    }

    .parking-smart-guide.state-warning .guide-title {
      color: #7D3C3C;
    }

    .parking-smart-guide.state-complete .guide-title {
      color: #2F5E48;
    }

    .parking-smart-guide .guide-step-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: #E6EEF8;
      color: #335687;
      border: 1px solid #D0DFEF;
    }

    .parking-smart-guide.state-warning .guide-step-badge {
      background: #F4E6E6;
      color: #8C3D3D;
      border-color: #E4CCCC;
    }

    .parking-smart-guide.state-complete .guide-step-badge {
      background: #E3F1EA;
      color: #2E644A;
      border-color: #C8E2D4;
    }

    .parking-smart-guide .guide-message {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: #475569;
      word-break: keep-all;
    }

    .parking-smart-guide .guide-message strong {
      font-weight: 700;
      color: #1E293B;
    }

    .parking-smart-guide.state-warning .guide-message strong {
      color: #8C3D3D;
    }

    /* 2. 할인등록 내역 리스트 및 [삭제 필요] 강조 (차분한 로즈 톤) */
    .section.parking .panel.list {
      padding: 15px 0;
    }

    .section.parking .panel.list > .body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 6px;
      border-top: 1px solid #e8e8e8;
      border-bottom: 1px solid #e8e8e8;
      background: #FFFFFF;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .section.parking .panel.list > .body + .body {
      border-top: none;
    }

    .section.parking .panel.list > .body.parking-empty {
      justify-content: center;
      color: #94A3B8;
      font-size: 13.5px;
      padding: 20px;
      background: #F8FAFC;
    }

    .section.parking .panel.list > .body.is-delete-needed {
      padding: 15px 12px;
      margin: 4px 0;
      border: 1px solid #DFAFAF !important;
      border-radius: 10px;
      background: #FCF8F8 !important;
      box-shadow: none;
    }

    @keyframes parkingDeletePulse {
      0%, 100% { transform: translateX(0); box-shadow: 0 0 0 0 rgba(184, 93, 93, 0.3); }
      25% { transform: translateX(-4px); box-shadow: 0 0 0 5px rgba(184, 93, 93, 0.15); }
      75% { transform: translateX(4px); box-shadow: 0 0 0 5px rgba(184, 93, 93, 0.15); }
    }

    .section.parking .panel.list > .body.pulse-focus {
      animation: parkingDeletePulse 0.45s ease-in-out 2;
    }

    .section.parking .panel.list .info_06 {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .section.parking .panel.list .info_06 .state.reserved {
      float: none;
      margin: 0;
    }

    .badge-delete-needed {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      border-radius: 30px;
      background: #F4E6E6;
      color: #8C3D3D;
      border: 1px solid #E2C5C5;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .section.parking .panel.list > .body.is-delete-needed .info_08 > .title {
      color: #6E3434;
    }

    /* 3. 사용 가능한 할인권 및 [추천] 뱃지 (칙칙한 회색/원색 파랑 대신 깔끔하고 정돈된 톤 적용) */
    .panel.discount .discount_list {
      display: block;
    }

    .panel.discount .discount_list li + li {
      margin-top: 6px;
    }

    .panel.discount .discount_list li .discount_coupon {
      position: relative;
      display: inline-flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 18px;
      border-radius: 12px;
      background-color: #3B6FB6;
      border: 1px solid #3261A3;
      box-shadow: 0 2px 6px rgba(59, 111, 182, 0.12);
      box-sizing: border-box;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .panel.discount .discount_list li .discount_coupon .title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 600;
      padding: 10px 0;
    }

    /* [추천] 강조 스타일 */
    .panel.discount .discount_list li .discount_coupon.is-recommended {
      background-color: #2F5FA3;
      border-color: #244D87;
      box-shadow: 0 3px 10px rgba(47, 95, 163, 0.2);
    }

    .badge-recommend {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #244D87;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* 비활성화 (칙칙한 진회색 #C4C8CB 대신 밝고 깔끔한 라이트 그레이 적용) */
    .panel.discount .discount_list li .discount_coupon:disabled {
      background-color: #F1F4F9 !important;
      border: 1px solid #E2E8F0 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
    }

    .panel.discount .discount_list li .discount_coupon:disabled .title {
      color: #94A3B8 !important;
    }
  </style>

  <script type="text/javascript" src="./js/jquery-3.6.0.js"></script>
  <script type="text/javascript" src="./js/mobile/common.js"></script>
</head>

<body>

  <!-- wrap -->
  <div id="wrap">
    <header>
      <div class="gnb">
        <div class="left">
          <a href="./parking_search.html"><i class="ico angle-left"></i></a>
          <a href="./menu_versions.html"><i class="ico home"></i></a>
        </div>
        <h1>주차정산</h1>
        <div class="right"><a href="#" class="total_nav btn-layer"><i class="ico menu">메뉴</i></a></div>
      </div>
    </header>
    <hr>

    <!-- contents -->
    <div id="contents">
      <article class="section table_list parking">

        <!-- 시연용 시나리오 전환 바 (목업 뷰어에서 5가지 주차 구간 테스트 지원) -->
        <div class="demo-scenario-bar">
          <div class="demo-scenario-head">
            <span>🧪 <strong>24시간 모듈러 룰 시나리오 시연</strong></span>
            <span id="demoRuleFormula">N=0일, R=13h 30m</span>
          </div>
          <div class="demo-scenario-chips">
            <button type="button" class="demo-chip active" data-scenario="case2">사례2: 13.5시간(삭제유도)</button>
            <button type="button" class="demo-chip" data-scenario="case1a">사례1-A: 5시간(일반)</button>
            <button type="button" class="demo-chip" data-scenario="case1b">사례1-B: 10시간(다건)</button>
            <button type="button" class="demo-chip" data-scenario="case3">사례3: 25시간(다일+1h)</button>
            <button type="button" class="demo-chip" data-scenario="case4">사례4: 35시간(다일장기)</button>
          </div>
        </div>

        <div class="panel_tab">
          <div class="row">
            <div class="col col-3 title">차량번호</div>
            <div class="col col-9">
              <input type="text" id="fieldVehicleNo" value="03라 2873" readonly>
            </div>
          </div>
          <div class="row">
            <div class="col col-3 title"></div>
            <div class="col col-9">
              <div class="img_warp">
                <img src="images/mobile_a/common/car_sample.svg" alt="차량 이미지" />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col col-3 title">입차일자</div>
            <div class="col col-9">
              <input type="text" id="fieldInDtm" value="2026.07.15 07:00:00" readonly>
            </div>
          </div>
          <div class="row">
            <div class="col col-3 title">주차시간</div>
            <div class="col col-9">
              <input type="text" id="fieldParkingTime" value="13시간 30분" readonly>
            </div>
          </div>
          <div class="row">
            <div class="col col-3 title">할인총시간</div>
            <div class="col col-9">
              <input type="text" id="fieldDiscountTotalTime" value="2시간" readonly>
            </div>
          </div>
          <p class="comment desc">출차 할인은 출차 5분전 등록 바랍니다.</p>
        </div>

        <!-- 1. 상단 상태 안내 가이드 박스 (신규) -->
        <div id="parkingSmartGuide" class="parking-smart-guide state-warning" role="status" aria-live="polite">
          <div class="guide-header">
            <span class="guide-title"><span aria-hidden="true">📢</span> 주차 할인 가이드</span>
            <span class="guide-step-badge" id="parkingGuideBadge">삭제 필요 2건</span>
          </div>
          <p class="guide-message" id="parkingGuideMessage">
            현재 <strong>13시간 30분</strong> 주차 중입니다. <strong>24시간 이용권</strong> 대상입니다.<br>
            기존 등록된 할인권을 삭제하신 후 24시간권을 등록해 주세요.
          </p>
        </div>

        <!-- 2. 할인등록 내역 리스트 -->
        <div class="panel list" id="parkingDiscountHistory"></div>

        <!-- 3. 사용 가능한 할인권 (기존 1열 풀폭 쿠폰 형태 그대로 유지) -->
        <div class="panel discount">
          <ul class="discount_list" id="parkingDiscountCodeList"></ul>
        </div>

        <div style="height: 90px; clear: both;">&nbsp;</div>

      </article>
    </div>
    <!-- //contents -->

    <!-- 하단 5개 탭 바 (가운데 커스텀 QR 배치) -->
    <div class="footerNav" style="border-top: 1px solid rgba(0,0,0,0.1); background: #ffffff;">
      <ul class="btnArea"
        style="display: flex !important; align-items: flex-end !important; margin: 0; padding: 0 10px 0;">
        <!-- 1. 좌석예약 -->
        <li style="flex: 1; float: none;">
          <a href="./booking.html?resveYn=N" class="seat"
            style="display: inline-block; text-align: center; width: 100%; height: 56px; position: relative; color: var(--text-black03-color); background: url('./images/mobile_a/common/ico_seat.svg') no-repeat center top; background-size: 36px auto;"><span
              style="display: inline-block; text-align: center; position: absolute; width: 100%; left: 0; bottom: 0; font-size: 13px;">좌석예약</span></a>
        </li>
        <!-- 2. 회의실예약 -->
        <li style="flex: 1; float: none;">
          <a href="./meeting_search.html" class="meet"
            style="display: inline-block; text-align: center; width: 100%; height: 56px; position: relative; color: var(--text-black03-color); background: url('./images/mobile_a/common/ico_meet.svg') no-repeat center top; background-size: 36px auto;"><span
              style="display: inline-block; text-align: center; position: absolute; width: 100%; left: 0; bottom: 0; font-size: 13px;">회의실예약</span></a>
        </li>
        <!-- 3. QR 인증 (가운데 센터 버튼) -->
        <li class="center-qr-li" style="flex: 1; float: none; overflow: visible !important;">
          <a href="./qr_scan.html" class="myQr center-qr-btn"
            style="position: relative !important; height: 56px !important; background: none !important; display: inline-block !important; width: 100% !important; overflow: visible !important; color: var(--text-black03-color) !important;">
            <div class="qr-circle"></div>
            <span
              style="display: inline-block; text-align: center; position: absolute; width: 100%; left: 0; bottom: 0; font-size: 13px;">QR
              인증</span>
          </a>
        </li>
        <!-- 4. 나의예약 -->
        <li style="flex: 1; float: none;">
          <a href="./my_reservations.html" class="myReserv"
            style="display: inline-block; text-align: center; width: 100%; height: 56px; position: relative; color: var(--text-black03-color); background: url('./images/mobile_a/common/ico_myReserv.svg') no-repeat center top; background-size: 36px auto;"><span
              style="display: inline-block; text-align: center; position: absolute; width: 100%; left: 0; bottom: 0; font-size: 13px;">나의예약</span></a>
        </li>
        <!-- 5. 주차정산 -->
        <li style="flex: 1; float: none;">
          <a href="./parking_search.html" class="parking"
            style="display: inline-block; text-align: center; width: 100%; height: 56px; position: relative; color: var(--text-black03-color); background: url('./images/mobile_a/common/ico_parking.svg') no-repeat center top; background-size: 36px auto;"><span
              style="display: inline-block; text-align: center; position: absolute; width: 100%; left: 0; bottom: 0; font-size: 13px;">주차정산</span></a>
        </li>
      </ul>
    </div>
  </div>

  <!-- 주차정산 알림 모달 -->
  <div id="parkAlertModal" class="parking-modal-overlay" style="display:none;">
    <div class="modal-box modal-size-normal">
      <div class="modal-inner">
        <p class="modal-title">알림</p>
        <div class="modal-pop">
          <p class="modal-text" id="parkAlertText"></p>
          <div class="hr"></div>
          <ul class="modal-buttons">
            <a href="javascript:;" class="modal-btn btn medium pri" id="parkAlertOk">확인</a>

  <!-- 주차정산 확인 모달 -->
  <div id="parkConfirmModal" class="parking-modal-overlay" style="display:none;">
    <div class="modal-box modal-size-normal">
      <div class="modal-inner">
        <p class="modal-title">확인</p>
        <div class="modal-pop">
          <p class="modal-text" id="parkConfirmText"></p>
          <div class="hr"></div>
          <ul class="modal-buttons">
            <a href="javascript:;" class="modal-btn btn medium" id="parkConfirmCancel">취소</a>
            <a href="javascript:;" class="modal-btn btn medium pri" id="parkConfirmOk">확인</a>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // 주차권 등록 개선 (24시간 모듈러 룰 엔진 & 인터랙티브 가이드 목업)
    // ==========================================================================
    var DAY_MINUTES = 1440;               // 24시간 (1,440분)
    var LONG_TERM_THRESHOLD_MINUTES = 660; // 11시간 (660분)
    var DISCOUNT_GRACE_MINUTES = 30;      // 30분 여유 한도

    // 외부 연동 API에서 내려오는 5종 할인권 명칭 그대로 유지
    var AVAILABLE_COUPONS = [
      { discCodeNo: 1, discName: '1시간무료할인', minutes: 60, isFree: true, is24h: false },
      { discCodeNo: 2, discName: '30분유료할인', minutes: 30, isFree: false, is24h: false },
      { discCodeNo: 3, discName: '1시간유료할인', minutes: 60, isFree: false, is24h: false },
      { discCodeNo: 4, discName: '24시간유료할인', minutes: 1440, isFree: false, is24h: true },
      { discCodeNo: 5, discName: '3시간유료할인', minutes: 180, isFree: false, is24h: false }
    ];

    // 개발방향서 5장 주차 시나리오별 프리셋
    var SCENARIOS = {
      case2: {
        label: '사례 2 · 13시간 30분 주차 (당일 장기 · 기존 쿠폰 있음)',
        inDtm: '2026.07.15 07:00:00',
        parkingMinutes: 810, // 13시간 30분 (N=0, R=13.5h >= 11h)
        history: [
          { id: 'H-1', discCodeNo: 1, discName: '1시간무료할인', minutes: 60, date: '26.07.15', time: '09:12' },
          { id: 'H-2', discCodeNo: 3, discName: '1시간유료할인', minutes: 60, date: '26.07.15', time: '09:12' }
        ]
      },
      case1a: {
        label: '사례 1-A · 5시간 주차 (11시간 미만 일반 주차)',
        inDtm: '2026.07.15 13:30:00',
        parkingMinutes: 300, // 5시간 (N=0, R=5h < 11h)
        history: []
      },
      case1b: {
        label: '사례 1-B · 10시간 주차 (3시간권 3회 연속 다건 등록)',
        inDtm: '2026.07.15 08:30:00',
        parkingMinutes: 600, // 10시간 (N=0, R=10h < 11h)
        history: [
          { id: 'H-10', discCodeNo: 1, discName: '1시간무료할인', minutes: 60, date: '26.07.15', time: '09:00' }
        ]
      },
      case3: {
        label: '사례 3 · 25시간 주차 (24h 1장 + 잔여 1h 무료권)',
        inDtm: '2026.07.14 17:30:00',
        parkingMinutes: 1500, // 25시간 (N=1, R=1h < 11h)
        history: []
      },
      case4: {
        label: '사례 4 · 35시간 주차 (24h + 잔여 11h ➔ 24시간권 2장)',
        inDtm: '2026.07.14 07:30:00',
        parkingMinutes: 2100, // 35시간 (N=1, R=11h >= 11h)
        history: [
          { id: 'H-40', discCodeNo: 4, discName: '24시간유료할인', minutes: 1440, date: '26.07.14', time: '18:00' }
        ]
      }
    };

    var currentScenarioKey = 'case2';
    var currentParkingMinutes = 810;
    var currentHistoryList = [];
    var nextIdSeq = 100;

    var _parkAlertCallback = null;
    var _parkConfirmCallback = null;

    function parkAlert(msg, cb) {
      $('#parkAlertText').text(msg);
      _parkAlertCallback = cb || null;
      $('#parkAlertModal').fadeIn(150);
    }

    function parkConfirm(msg, cb) {
      $('#parkConfirmText').text(msg);
      _parkConfirmCallback = cb || null;
      $('#parkConfirmModal').fadeIn(150);
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function getTimestamp() {
      var now = new Date();
      var yy = pad2(now.getFullYear() % 100);
      var mm = pad2(now.getMonth() + 1);
      var dd = pad2(now.getDate());
      var hh = pad2(now.getHours());
      var mi = pad2(now.getMinutes());
      return { date: yy + '.' + mm + '.' + dd, time: hh + ':' + mi };
    }

    function formatMinutesText(totalMinutes) {
      var mins = Math.max(Number(totalMinutes) || 0, 0);
      if (mins === 0) return '0분';
      var hours = Math.floor(mins / 60);
      var rem = mins % 60;
      if (hours > 0 && rem > 0) return hours + '시간 ' + rem + '분';
      if (hours > 0) return hours + '시간';
      return rem + '분';
    }

    function formatParkingDuration(totalMinutes) {
      var mins = Math.max(Number(totalMinutes) || 0, 0);
      var hours = Math.floor(mins / 60);
      var rem = mins % 60;
      if (hours > 0 && rem > 0) return hours + '시간 ' + rem + '분';
      if (hours > 0) return hours + '시간';
      return rem + '분';
    }

    // 24시간 모듈러 룰 엔진 계산
    function evaluateModularRule(parkingMinutes, historyList) {
      var safeMinutes = Math.max(Number(parkingMinutes) || 0, 0);
      var list = historyList || [];

      var completedDays = Math.floor(safeMinutes / DAY_MINUTES); // N (일수)
      var remainderMinutes = safeMinutes % DAY_MINUTES;          // R (잔여 시간)
      var isRemainderLongTerm = remainderMinutes >= LONG_TERM_THRESHOLD_MINUTES;

      var required24hCount = 0;
      var remainderTargetMinutes = 0;
      var zoneType = 'ZONE_1';

      if (completedDays === 0 && !isRemainderLongTerm) {
        zoneType = 'ZONE_1'; // 구간 ① 일반 주차 (<11h)
        required24hCount = 0;
        remainderTargetMinutes = remainderMinutes;
      } else if ((completedDays === 0 && isRemainderLongTerm) || (completedDays === 1 && remainderMinutes === 0)) {
        zoneType = 'ZONE_2'; // 구간 ② 당일 장기 (11h ~ 24h)
        required24hCount = 1;
        remainderTargetMinutes = 0;
      } else if (completedDays >= 1 && !isRemainderLongTerm) {
        zoneType = 'ZONE_3'; // 구간 ③ 다일 주차 (잔여 <11h)
        required24hCount = completedDays;
        remainderTargetMinutes = remainderMinutes;
      } else {
        zoneType = 'ZONE_4'; // 구간 ④ 다일 장기 (잔여 >=11h)
        required24hCount = completedDays + 1;
        remainderTargetMinutes = 0;
      }

      var seen24h = 0;
      var seenFree = 0;
      var accNon24hMinutes = 0;
      var maxNon24hAllowed = remainderTargetMinutes > 0
        ? (remainderTargetMinutes + DISCOUNT_GRACE_MINUTES)
        : 0;
      var hasAnyFreeInHistory = list.some(function (h) { return h.discCodeNo === 1; });

      var historyAnnotations = list.map(function (item) {
        var is24h = item.discCodeNo === 4 || item.minutes >= DAY_MINUTES;
        var isFree = item.discCodeNo === 1;
        var mins = Number(item.minutes) || 0;
        var needsDelete = false;

        if (is24h) {
          seen24h += 1;
          if (seen24h > required24hCount) {
            needsDelete = true;
          }
        } else {
          if (remainderTargetMinutes === 0) {
            needsDelete = true;
          } else if (isFree) {
            seenFree += 1;
            if (seenFree > 1) {
              needsDelete = true;
            } else {
              accNon24hMinutes += mins;
            }
          } else {
            if (!hasAnyFreeInHistory || (accNon24hMinutes + mins > maxNon24hAllowed)) {
              needsDelete = true;
            } else {
              accNon24hMinutes += mins;
            }
          }
        }

        return {
          item: item,
          needsDelete: needsDelete
        };
      });

      var deleteNeededCount = historyAnnotations.filter(function (a) { return a.needsDelete; }).length;
      var hasDeleteNeeded = deleteNeededCount > 0;
      var valid24hCount = Math.min(seen24h, required24hCount);
      var hasValidFree = seenFree >= 1 && remainderTargetMinutes > 0;
      var uncoveredRemainderMinutes = Math.max(remainderTargetMinutes - accNon24hMinutes, 0);
      var remainingAdditionalNon24hLimit = Math.max(maxNon24hAllowed - accNon24hMinutes, 0);
      var totalDiscountMinutes = list.reduce(function (sum, item) { return sum + (Number(item.minutes) || 0); }, 0);
      var isFullyCovered = !hasDeleteNeeded
        && (valid24hCount >= required24hCount)
        && (uncoveredRemainderMinutes <= 0)
        && (totalDiscountMinutes >= safeMinutes);

      return {
        parkingMinutes: safeMinutes,
        completedDays: completedDays,
        remainderMinutes: remainderMinutes,
        zoneType: zoneType,
        required24hCount: required24hCount,
        remainderTargetMinutes: remainderTargetMinutes,
        valid24hCount: valid24hCount,
        hasValidFree: hasValidFree,
        accNon24hMinutes: accNon24hMinutes,
        uncoveredRemainderMinutes: uncoveredRemainderMinutes,
        remainingAdditionalNon24hLimit: remainingAdditionalNon24hLimit,
        historyAnnotations: historyAnnotations,
        deleteNeededCount: deleteNeededCount,
        hasDeleteNeeded: hasDeleteNeeded,
        totalDiscountMinutes: totalDiscountMinutes,
        isFullyCovered: isFullyCovered
      };
    }

    function focusFirstDeleteNeededItem() {
      var $firstTarget = $('#parkingDiscountHistory .body.is-delete-needed').first();
      if (!$firstTarget.length) return;

      var $container = $('#contents');
      if ($container.length) {
        var targetTop = $firstTarget.offset().top - $container.offset().top + $container.scrollTop() - 80;
        $container.animate({ scrollTop: Math.max(targetTop, 0) }, 300);
      }
      $firstTarget.removeClass('pulse-focus');
      void $firstTarget[0].offsetWidth;
      $firstTarget.addClass('pulse-focus');
      $firstTarget.find('.btn_del').trigger('focus');
    }

    function renderAll() {
      var rule = evaluateModularRule(currentParkingMinutes, currentHistoryList);
      var parkTimeText = formatParkingDuration(currentParkingMinutes);

      $('#fieldParkingTime').val(parkTimeText);
      $('#fieldDiscountTotalTime').val(formatMinutesText(rule.totalDiscountMinutes));
      $('#demoRuleFormula').text(
        'N=' + rule.completedDays + '일, R=' + formatMinutesText(rule.remainderMinutes)
      );

      // 1. 상단 스마트 가이드 박스 렌더링
      var $guide = $('#parkingSmartGuide');
      var $badge = $('#parkingGuideBadge');
      var $msg = $('#parkingGuideMessage');
      $guide.removeClass('state-warning state-recommend state-complete');

      if (rule.hasDeleteNeeded) {
        $guide.addClass('state-warning');
        $badge.text('삭제 필요 ' + rule.deleteNeededCount + '건');
        $msg.html(
          '현재 <strong>' + parkTimeText + '</strong> 주차 중입니다. <strong>24시간 이용권</strong> 대상입니다.<br>' +
          '기존 등록된 <strong>[삭제 필요]</strong> 할인권을 삭제하신 후 24시간권을 등록해 주세요.'
        );
      } else if (rule.isFullyCovered) {
        $guide.addClass('state-complete');
        $badge.text('정산 준비 완료');
        $msg.html(
          '현재 주차시간(<strong>' + parkTimeText + '</strong>)에 대한 할인권 등록(총 <strong>' +
          formatMinutesText(rule.totalDiscountMinutes) + '</strong>)이 완료되었습니다.'
        );
      } else if (rule.valid24hCount < rule.required24hCount) {
        var remain24h = rule.required24hCount - rule.valid24hCount;
        $guide.addClass('state-recommend');
        $badge.text('24시간권 대상');
        if (rule.zoneType === 'ZONE_2') {
          $msg.html(
            '현재 <strong>' + parkTimeText + '</strong> 주차 중입니다. (11시간 이상 장기주차)<br>' +
            '기존 할인권이 없으므로 <strong>[추천]</strong> 표시된 <strong>[24시간유료할인]</strong>을 등록해 주세요.'
          );
        } else if (rule.zoneType === 'ZONE_3') {
          $msg.html(
            '<strong>' + parkTimeText + '</strong> 주차 차량입니다.<br>' +
            '<strong>[24시간유료할인 ' + remain24h + '장]</strong> 등록 후 잔여 시간(' +
            formatMinutesText(rule.remainderTargetMinutes) + ')에 대해 [1시간무료할인]을 등록해 주세요.'
          );
        } else {
          $msg.html(
            '<strong>' + parkTimeText + '</strong> 장기 주차 차량입니다. (잔여 11시간 이상)<br>' +
            '<strong>[24시간유료할인]</strong> 총 <strong>' + rule.required24hCount + '장</strong>이 필요합니다. (현재 ' +
            rule.valid24hCount + '/' + rule.required24hCount + '장 등록됨)'
          );
        }
      } else if (!rule.hasValidFree) {
        $guide.addClass('state-recommend');
        $badge.text('1단계 · 무료권 선등록');
        if (rule.zoneType === 'ZONE_3') {
          $msg.html(
            '24시간 이용권(' + rule.valid24hCount + '장) 등록이 완료되었습니다.<br>' +
            '잔여 주차시간(<strong>' + formatMinutesText(rule.remainderTargetMinutes) + '</strong>)에 대해 <strong>[1시간무료할인]</strong>을 등록해 주세요.'
          );
        } else {
          $msg.html(
            '현재 <strong>' + parkTimeText + '</strong> 주차 중입니다. (11시간 미만 일반주차)<br>' +
            '<strong>[추천]</strong> 표시된 <strong>[1시간무료할인]</strong>을 가장 먼저 등록해 주세요.'
          );
        }
      } else {
        $guide.addClass('state-recommend');
        $badge.text('2단계 · 시간권 추가');
        $msg.html(
          '현재 총 <strong>' + formatMinutesText(rule.totalDiscountMinutes) + '</strong> 할인이 적용되었습니다.<br>' +
          '남은 주차시간(<strong>' + formatMinutesText(rule.uncoveredRemainderMinutes) + '</strong>)에 맞춰 <strong>[추천]</strong> 유료 시간권을 등록해 주세요. (다건 등록 가능)'
        );
      }

      // 2. 할인등록 내역 리스트 렌더링
      var $history = $('#parkingDiscountHistory').empty();

      if (currentHistoryList.length === 0) {
        $history.append('<div class="body parking-empty">할인등록 내역이 없습니다.</div>');
      } else {
        rule.historyAnnotations.forEach(function (annotation) {
          var h = annotation.item;
          var $body = $('<div>', {
            'class': 'body' + (annotation.needsDelete ? ' is-delete-needed' : ''),
            'data-history-id': h.id
          });

          var $meta = $('<span>', { 'class': 'info_06' })
            .append($('<span>', { 'class': 'state reserved' }).text('할인등록 내역'))
            .append($('<span>', { 'class': 'date' }).text(h.date))
            .append($('<time>').text(h.time));

          if (annotation.needsDelete) {
            $meta.append($('<span>', { 'class': 'badge-delete-needed' }).text('삭제 필요'));
          }

          var $info = $('<div>', { 'class': 'discount_info' })
            .append($meta)
            .append($('<span>', { 'class': 'info_08' }).append($('<span>', { 'class': 'title' }).text(h.discName)));

          var $delBtn = $('<button>', { type: 'button', 'class': 'btn_del', title: '삭제' }).text('삭제');
          $body.append($info).append($delBtn);
          $history.append($body);
        });
      }

      // 3. 사용 가능한 할인권 렌더링 (기존 1열 풀폭 쿠폰 모양 그대로 + [추천] 뱃지만 표시)
      var $couponList = $('#parkingDiscountCodeList').empty();

      var recommendedHourlyCodeNo = null;
      if (
        !rule.hasDeleteNeeded &&
        rule.valid24hCount >= rule.required24hCount &&
        rule.remainderTargetMinutes > 0 &&
        rule.hasValidFree &&
        rule.uncoveredRemainderMinutes > 0
      ) {
        if (rule.uncoveredRemainderMinutes >= 120 && 180 <= rule.remainingAdditionalNon24hLimit) {
          recommendedHourlyCodeNo = 5; // 3시간유료할인 추천
        } else if (rule.uncoveredRemainderMinutes > 30 && 60 <= rule.remainingAdditionalNon24hLimit) {
          recommendedHourlyCodeNo = 3; // 1시간유료할인 추천
        } else if (30 <= rule.remainingAdditionalNon24hLimit) {
          recommendedHourlyCodeNo = 2; // 30분유료할인 추천
        }
      }

      AVAILABLE_COUPONS.forEach(function (coupon) {
        var isEnabled = false;
        var isRecommended = false;
        var requiresDeleteBeforeUse = false;

        if (coupon.is24h) {
          if (rule.valid24hCount < rule.required24hCount) {
            isEnabled = true;
            isRecommended = true;
            requiresDeleteBeforeUse = rule.hasDeleteNeeded;
          } else {
            isEnabled = false;
          }
        } else if (coupon.isFree) {
          if (
            !rule.hasDeleteNeeded &&
            rule.valid24hCount >= rule.required24hCount &&
            rule.remainderTargetMinutes > 0 &&
            !rule.hasValidFree
          ) {
            isEnabled = true;
            isRecommended = true;
          } else {
            isEnabled = false;
          }
        } else {
          if (
            !rule.hasDeleteNeeded &&
            rule.valid24hCount >= rule.required24hCount &&
            rule.remainderTargetMinutes > 0 &&
            rule.hasValidFree &&
            rule.uncoveredRemainderMinutes > 0 &&
            coupon.minutes <= rule.remainingAdditionalNon24hLimit
          ) {
            isEnabled = true;
            isRecommended = (coupon.discCodeNo === recommendedHourlyCodeNo);
          } else {
            isEnabled = false;
          }
        }

        var $btn = $('<button>', {
          type: 'button',
          'class': 'discount_coupon' + (isRecommended ? ' is-recommended' : ''),
          disabled: !isEnabled,
          'data-disc-code-no': coupon.discCodeNo,
          'data-requires-delete': requiresDeleteBeforeUse ? 'true' : 'false'
        });

        $btn.append($('<span>', { 'class': 'title' }).text(coupon.discName));
        if (isRecommended) {
          $btn.append($('<span>', { 'class': 'badge-recommend' }).text('추천'));
        }

        $couponList.append($('<li>').append($btn));
      });
    }

    function applyScenario(key) {
      var preset = SCENARIOS[key] || SCENARIOS.case2;
      currentScenarioKey = key in SCENARIOS ? key : 'case2';
      currentParkingMinutes = preset.parkingMinutes;
      currentHistoryList = preset.history.map(function (item) {
        return $.extend({}, item);
      });
      $('#fieldInDtm').val(preset.inDtm);
      $('.demo-chip').removeClass('active');
      $('.demo-chip[data-scenario="' + currentScenarioKey + '"]').addClass('active');
      renderAll();
    }

    function initParking() {
      // URL 파라미터(?scenario=case1a 등) 지원
      var params = new URLSearchParams(window.location.search);
      var initialScenario = params.get('scenario') || 'case2';
      applyScenario(initialScenario);

      // 시나리오 전환 칩 클릭
      $(document).on('click', '.demo-chip', function () {
        var key = $(this).data('scenario');
        applyScenario(key);
      });

      // 알림 모달 확인 버튼
      $('#parkAlertOk').on('click', function () {
        $('#parkAlertModal').fadeOut(150);
        if (typeof _parkAlertCallback === 'function') {
          var cb = _parkAlertCallback;
          _parkAlertCallback = null;
          cb();
        }
      });

      // 확인 모달 취소 버튼
      $('#parkConfirmCancel').on('click', function () {
        $('#parkConfirmModal').fadeOut(150);
        _parkConfirmCallback = null;
      });

      // 확인 모달 확인 버튼
      $('#parkConfirmOk').on('click', function () {
        $('#parkConfirmModal').fadeOut(150);
        if (typeof _parkConfirmCallback === 'function') {
          var cb = _parkConfirmCallback;
          _parkConfirmCallback = null;
          cb();
        }
      });

      // 할인등록 내역 삭제 버튼
      $(document).on('click', '.btn_del', function () {
        var $body = $(this).closest('.body');
        var historyId = $body.data('history-id');
        parkConfirm('선택한 할인등록 내역을 삭제하시겠습니까?', function () {
          currentHistoryList = currentHistoryList.filter(function (item) {
            return String(item.id) !== String(historyId);
          });
          renderAll();
          parkAlert('삭제가 완료되었습니다.');
        });
      });

      // 사용 가능한 할인권 클릭
      $(document).on('click', '.discount_coupon:not(:disabled)', function () {
        var $btn = $(this);
        var requiresDelete = $btn.attr('data-requires-delete') === 'true';

        // 4.3: 11시간 이상인데 기존 쿠폰이 남아있는 상태에서 [24시간유료할인] 클릭 시 삭제 유도 팝업 + 스크롤 포커스
        if (requiresDelete) {
          parkAlert(
            '기존에 등록된 할인권을 먼저 삭제해야 24시간 이용권을 등록할 수 있습니다.\n목록에서 [삭제 필요] 할인권을 삭제해 주세요.',
            function () {
              focusFirstDeleteNeededItem();
            }
          );
          return;
        }

        var codeNo = Number($btn.data('disc-code-no'));
        var coupon = AVAILABLE_COUPONS.find(function (c) { return c.discCodeNo === codeNo; });
        if (!coupon) return;

        var ts = getTimestamp();
        nextIdSeq += 1;
        currentHistoryList.push({
          id: 'H-' + nextIdSeq,
          discCodeNo: coupon.discCodeNo,
          discName: coupon.discName,
          minutes: coupon.minutes,
          date: ts.date,
          time: ts.time
        });

        renderAll();
        parkAlert('[' + coupon.discName + '] 할인권이 등록되었습니다.');
      });
    }

    $(function () {
      initParking();
    });
  </script>
</body>

</html>
