<!DOCTYPE html>
<html lang="ko">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>스마트오피스 예약시스템</title>

    <link rel="stylesheet" type="text/css" href="./css/mobile_a/fonts.css" />
    <link rel="stylesheet" type="text/css" href="./css/mobile_a/base.css" />
    <link rel="stylesheet" type="text/css" href="./css/mobile_a/common.css" />
    <link rel="stylesheet" type="text/css" href="./css/mobile_a/layout.css" />
    <link rel="stylesheet" type="text/css" href="./css/mobile_a/colorStyle.css" />
    <link rel="stylesheet" type="text/css" href="./css/mobile_a/styleLayout.css" />
    <!-- 알림 모달 CSS (login_alert 스타일) -->
    <link rel="stylesheet" href="./css/mobile_a/jquery.modal.css" />
    <style>
        /* 인증번호 영역 슬라이드 애니메이션 */
        #auth_view {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
        }

        #auth_view.visible {
            max-height: 320px;
            opacity: 1;
        }

        /* 아이디/패스워드 readonly 상태 스타일 */
        #id[readonly],
        #password[readonly] {
            background: #f5f7fa !important;
            color: #555 !important;
            cursor: default !important;
        }

        /* 로그인 버튼 영역 전환 */
        #login_btn_area {
            transition: opacity 0.3s ease;
        }

        #login_btn_area.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <form>
        <!-- wrap -->
        <div id="wrap">
            <!-- contents -->
            <section id="contents">
                <div>
                    <!--  -->
                    <section class="loginArea">
                        <div class="loginBox">
                            <fieldset>
                                <div class="title"> <img src="./images/mobile_a/common/logo.svg" alt="로고" />
                                    <p class="title">스마트오피스 예약시스템</p>
                                </div>
                                <legend class="blind">로그인 영역</legend>
                                <p>
                                    <input type="text" name="id" id="id" class="medium"
                                        placeholder="아이디를 입력하세요. (kgc + 사번)" autocapitalize="off" />
                                </p>
                                <p>
                                    <input type="password" name="password" id="password" class="medium"
                                        placeholder="비밀번호를 입력하세요." />
                                </p>
                                <p class="id_save">
                                    <input type="checkbox" id="autoLogin" name="autoLogin" />
                                    <label for="autoLogin" id="autoLoginLabel">자동 로그인</label>
                                    <input type="checkbox" id="checkId" name="checkId" />
                                    <label for="checkId">아이디저장<!-- 아이디 저장 --></label>
                                </p>
                            </fieldset>

                            <!-- 인증번호 입력 영역 (로그인 성공 후 표시) -->
                            <article id="auth_view">
                                <ul class="auth">
                                    <li>
                                        <input type="text" id="authCode" class="medium" placeholder="인증번호 입력"
                                            maxlength="6">
                                        <a href="javascript:;" id="btnResend" class="btn medium pri"><span>인증키
                                                재발송</span></a>
                                    </li>
                                    <li><a href="javascript:;" id="btnVerify" class="btn medium pri"><span>인증</span></a>
                                    </li>
                                </ul>
                                <p class="comment" id="authError" style="display: none;"> <em class="non-match">인증번호를 다시
                                        확인해 주세요.</em> </p>
                                <p class="comment check-time">남은시간 : <em class="non-match" id="remainTime">03:00</em>초
                                </p>
                            </article>

                            <!-- 2026-07-07 수정 : S -->
                            <div class="login_btn" id="login_btn_area">
                                <a href="javascript:;" id="loginBtn" class="btn pri btn_f">로그인<!-- 로그인 --></a>
                            </div>
                            <div class="login_btn">
                                <a href="javascript:;" class="btn btn_f bio"><span>생체인증으로
                                        로그인</span><!-- 생체인증으로 로그인 --></a>
                            </div>
                            <!-- 2026-07-07 수정 : E -->
                            <div class="descArea">
                                <p class="desc">다음 로그인부터 지문으로<br>더 빠르게 접속할 수 있어요.</p>
                            </div>
                        </div>
                    </section>
                    <!-- // -->
                </div>
            </section>
            <!-- //contents -->
        </div>
        <!-- //wrap -->
    </form>

    <!-- 알림 모달 (login_alert.html 디자인) -->
    <div id="modal-window" style="display: none;">
        <div class="modal-box modal-size-normal">
            <div class="modal-inner">
                <p class="modal-title">알림</p>
                <div class="modal-pop">
                    <p class="modal-text" id="modalText">아이디나 비밀번호가 일치하지 않습니다.</p>
                    <div class="hr"></div>
                    <ul class="modal-buttons">
                        <a href="javascript:;" class="modal-btn btn medium pri btn-layerClose">확인</a>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="./js/jquery-3.6.0.js"></script>
    <script>
        $(function () {
            var timeLeft = 0;
            var timerId = null;
            var redirectOnClose = false;

            function showModal(text, isSuccess) {
                $('#modalText').text(text);
                $('#modal-window').show();
                redirectOnClose = !!isSuccess;
            }

            $('.btn-layerClose').on('click', function () {
                $('#modal-window').hide();
                if (redirectOnClose) {
                    location.href = './menu_versions.html';
                }
            });

            // ── 로그인 처리 ──────────────────────────────
            function login() {
                var id = $('#id').val().trim();
                var password = $('#password').val().trim();

                if (!id) {
                    showModal('아이디를 입력해 주세요.');
                    return;
                }
                if (!password) {
                    showModal('비밀번호를 입력해 주세요.');
                    return;
                }

                // 비밀번호가 1234인 경우 성공
                if (password === '1234') {
                    // 아이디/비밀번호 필드를 readonly로 고정 (값 유지)
                    $('#id').prop('readonly', true);
                    $('#password').prop('readonly', true);

                    // 로그인 버튼 숨기기
                    $('#login_btn_area').addClass('hidden');

                    // 인증번호 입력 영역 표시 (슬라이드 애니메이션)
                    $('#auth_view').addClass('visible');

                    // 타이머 시작
                    startTimer();

                    // 인증번호 필드로 포커스 이동
                    setTimeout(function () { $('#authCode').focus(); }, 400);
                } else {
                    showModal('아이디나 비밀번호가 일치하지 않습니다.');
                }
            }

            $('#loginBtn').on('click', function (e) {
                e.preventDefault();
                login();
            });

            $('#id, #password').on('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    login();
                }
            });

            // ── 인증 타이머 ──────────────────────────────
            function startTimer() {
                if (timerId) clearInterval(timerId);
                timeLeft = 180;
                updateTimerDisplay();

                timerId = setInterval(function () {
                    timeLeft--;
                    updateTimerDisplay();

                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        showModal('인증 시간이 초과되었습니다. 인증키 재발송을 눌러주세요.');
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                var minutes = Math.floor(timeLeft / 60);
                var seconds = timeLeft % 60;
                var timeStr = (minutes < 10 ? '0' + minutes : minutes) + ':' + (seconds < 10 ? '0' + seconds : seconds);
                $('#remainTime').text(timeStr);
            }

            // ── 인증키 재발송 ─────────────────────────────
            $('#btnResend').on('click', function (e) {
                e.preventDefault();
                startTimer();
                $('#authError').hide();
                $('#authCode').val('');
                showModal('인증키가 재발송되었습니다.');
            });

            // ── 인증 버튼 ────────────────────────────────
            $('#btnVerify').on('click', function (e) {
                e.preventDefault();
                var code = $('#authCode').val().trim();

                if (!code) {
                    showModal('인증번호를 입력해 주세요.');
                    return;
                }

                if (timeLeft <= 0) {
                    showModal('인증 시간이 초과되었습니다. 인증키 재발송을 클릭해 주세요.');
                    return;
                }

                // 인증번호가 123456인 경우 성공
                if (code === '123456') {
                    clearInterval(timerId);
                    showModal('본인 인증에 성공하였습니다.', true);
                } else {
                    $('#authError').show();
                }
            });

            // Enter 입력 시 인증 시도
            $('#authCode').on('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    $('#btnVerify').trigger('click');
                }
            });

            // 생체인증 버튼 클릭 시
            $('.bio').on('click', function (e) {
                e.preventDefault();
                showModal('생체인증 로그인 기능은 시연 준비 중입니다. 일반 로그인을 이용해 주세요.');
            });
        });
    </script>
</body>

</html>
