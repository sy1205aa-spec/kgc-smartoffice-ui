<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>스마트오피스 예약시스템</title>

    <link rel="stylesheet" type="text/css" href="../css/mobile_a/fonts.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/base.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/icons.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/colorStyle.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/common.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/jquery.modal.css" />
    <link rel="stylesheet" type="text/css" href="../css/xeicon/xeicon.min.css" />
    <!-- 웹 전용 (마지막에 링크하여 오버라이드) -->
    <link rel="stylesheet" type="text/css" href="../css/web_a/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/web_a/common.css" />

    <script type="text/javascript" src="../js/jquery-3.6.0.js"></script>
    <script type="text/javascript" src="../js/mobile/common.js"></script>
    <link rel="stylesheet" href="./common.css">
<script src="./presentation.js" defer></script>
</head>

<body class="bg03">
    <form>
        <!-- wrap -->
        <div id="wrap">
      <header id="portalHeader"></header>

            <!-- WEB 수정 START -->
            <!-- contents -->
            <div id="contents">
                <section class="section">
                    <div class="page_wrap">
                        <div class="page_title">
                            <h2>알림 팝업</h2>
                            <p>확인 버튼이 있는 단순 알림 팝업입니다.</p>
                        </div>
                        <div class="pageCont">
                            <button type="button" class="btn medium pri alertOpenBtn">알림 팝업 열기</button>
                        </div>
                    </div>
                </section>
            </div>
            <!-- //contents -->
            <!-- WEB 수정 END -->

        </div>
        <!-- //wrap -->
    </form>

    <!-- WEB 수정 START -->
    <div id="modal-window">
        <div class="modal-box modal-size-normal">
            <div class="modal-inner">
                <div class="modal-pop">
                    <p class="modal-text">예약이 불가능한 시간입니다.<br>예약시간을 확인해 주세요.</p>
                    <ul class="modal-buttons">
                        <a class="modal-btn btn medium pri btn-layerClose">확인</a>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- WEB 수정 END -->

    <script type="text/javascript" src="../js/web_a/common.js"></script>
    <script src="./common.js"></script>
</body>

</html>
