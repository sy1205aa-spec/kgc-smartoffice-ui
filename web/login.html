<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - KGC 스마트오피스 예약시스템</title>

    <link rel="shortcut icon" href="../images/web_a/common/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/fonts.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/base.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/icons.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/colorStyle.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/common.css" />
    <link rel="stylesheet" type="text/css" href="../css/mobile_a/jquery.modal.css" />
    <link rel="stylesheet" type="text/css" href="../css/xeicon/xeicon.min.css" />
    <!-- 웹 전용 (마지막에 링크하여 오버라이드) -->
    <link rel="stylesheet" type="text/css" href="../css/web_a/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/web_a/common.css" />
    <link rel="stylesheet" type="text/css" href="./common.css" />

    <script src="../js/jquery-3.6.0.js"></script>
    <script src="./common.js"></script>
<script src="./presentation.js" defer></script>
</head>

<body>
    <form id="loginForm" method="post" autocomplete="off" onsubmit="return false;">
        <!-- wrap -->
        <div id="wrap">
            <!-- contents -->
            <section id="contents">
                <div>
                    <section class="loginArea">
                        <div class="loginBox">
                            <fieldset class="login-main-fields">
                                <div class="title">
                                    <img src="../images/web_a/common/img_login_logo.svg" alt="KGC 로고" />
                                    <p class="title">스마트오피스 예약시스템</p>
                                </div>
                                <legend class="blind">로그인 영역</legend>
                                <p>
                                    <input type="text" name="id" id="userId" class="medium" value="kgc202401" placeholder="아이디를 입력하세요. (kgc+사번)" autocapitalize="off" />
                                </p>
                                <p>
                                    <input type="password" name="password" id="userPw" class="medium" value="1234" placeholder="비밀번호를 입력하세요." />
                                </p>
                                <p class="id_save">
                                    <input type="checkbox" id="autoLogin" name="autoLogin" />
                                    <label for="autoLogin">자동로그인</label>
                                    <input type="checkbox" id="checkId" name="checkId" checked />
                                    <label for="checkId">아이디저장</label>
                                </p>
                            </fieldset>
                            <div class="login_btn">
                                <a href="javascript:;" id="loginBtn" class="btn pri btn_f">로그인</a>
                            </div>
                            <article id="auth_view" style="display: none;">
                                <ul class="auth">
                                    <li>
                                        <input type="text" id="smsCode" class="medium" value="123456" placeholder="인증번호 입력" maxlength="6">
                                        <a href="javascript:;" class="btn medium pri btn-resend"><span>인증키 재발송</span></a>
                                    </li>
                                    <li>
                                        <a href="javascript:;" class="btn medium pri verify-btn"><span>인증</span></a>
                                    </li>
                                </ul>
                                <p class="comment check-time">남은시간 <em class="non-match" id="remainTime">02:39</em>초</p>
                            </article>
                        </div>
                    </section>
                </div>
            </section>
            <!-- //contents -->
        </div>
        <!-- //wrap -->
    </form>

    <!-- 현업 시연용 상태 전환 플로팅 바 -->
    <div class="demo-scenario-bar">
        <span class="demo-label">💡 시연 화면 전환:</span>
        <button type="button" class="demo-btn active" data-mode="normal" onclick="toggleSmsView(false)">기본 로그인 (login)</button>
        <button type="button" class="demo-btn" data-mode="cert" onclick="toggleSmsView(true)">인증영역 활성화 (login_cert)</button>
    </div>

    <!-- 1020 공통 알림 모달 -->
    <div id="modal-window" style="display: none;">
        <div class="modal-box modal-size-normal">
            <div class="modal-inner">
                <div class="modal-pop">
                    <p id="modal-text" class="modal-text"></p>
                    <ul id="modal-buttons" class="modal-buttons"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSmsView(showSms) {
            $('.demo-scenario-bar .demo-btn').removeClass('active');
            $(`.demo-scenario-bar .demo-btn[data-mode="${showSms ? 'cert' : 'normal'}"]`).addClass('active');

            if (showSms) {
                $('.login-main-fields').find('input').prop('disabled', true);
                $('#auth_view').stop(true, true).slideDown(200);
            } else {
                $('.login-main-fields').find('input').prop('disabled', false);
                $('#auth_view').stop(true, true).slideUp(200);
            }
        }

        $(function () {
            // URL 파라미터 ?mode=cert 검사
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'cert') {
                toggleSmsView(true);
            }

            $('#loginBtn, .verify-btn').on('click', function () {
                window.location.href = './main.html';
            });

            $('.btn-resend').on('click', function () {
                soAlert('인증번호가 재발송되었습니다.');
            });
        });
    </script>
</body>

</html>
